# Y-Summit Season 4 2026 — Render Blueprint
#
# The production database is hosted on Supabase. Configure its connection
# through Render environment variables; this Blueprint never creates or
# resets a database.
#
# Schema preparation is handled once by server startup (database/ensureSchema.js).
# Do not run db:sync with alter:true on every deploy against production data.

services:
  - type: web
    name: gy-summit-2026-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: FRONTEND_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_NAME
        value: postgres
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: ADMISSION_QR_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_FOLDER
        value: gysummit
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SMS_SENDER
        value: YSummit
      - key: BREVO_WHATSAPP_SENDER
        sync: false
      - key: BREVO_WHATSAPP_TEMPLATE_ID
        sync: false
      - key: TICKET_PRICE
        value: "2200"
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: SEED_ADMIN_NAME
        sync: false
      - key: SEED_ADMIN_PHONE
        sync: false
